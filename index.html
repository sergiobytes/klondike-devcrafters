<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solitario</title>
  </head>
  <body
    class="min-h-dvh bg-radial from-mesa to-mesa-oscura text-white antialiased"
  >
    <header
      class="mx-auto flex max-w-3xl items-center justify-between gap-2 px-3 py-3 sm:px-4 sm:py-4"
    >
      <h1 class="text-lg font-bold tracking-tight sm:text-2xl">🃏 Solitario</h1>
      <div class="flex items-center gap-3 text-sm sm:gap-4 sm:text-base">
        <span class="tabular-nums"
          >Movimientos: <strong id="movimientos">0</strong></span
        >
        <button
          id="nuevo"
          class="rounded-lg bg-white px-3 py-1.5 font-semibold text-mesa shadow transition hover:scale-105 active:scale-95 sm:px-4 sm:py-2"
        >
          Nuevo
        </button>
      </div>
    </header>

    <main id="mesa" class="mx-auto max-w-3xl px-3 pb-10 sm:px-4">
      <div
        class="mb-4 grid grid-cols-7 justify-items-center gap-1 sm:mb-6 sm:gap-3"
      >
        <div data-tipo="mazo" data-i="0" class="hueco"></div>
        <div data-tipo="descarte" data-i="0" class="hueco"></div>
        <div></div>
        <div data-tipo="fundacion" data-i="0" class="hueco"></div>
        <div data-tipo="fundacion" data-i="1" class="hueco"></div>
        <div data-tipo="fundacion" data-i="2" class="hueco"></div>
        <div data-tipo="fundacion" data-i="3" class="hueco"></div>
      </div>
      <div class="grid grid-cols-7 justify-items-center gap-1 sm:gap-3">
        <div data-tipo="columna" data-i="0" class="hueco"></div>
        <div data-tipo="columna" data-i="1" class="hueco"></div>
        <div data-tipo="columna" data-i="2" class="hueco"></div>
        <div data-tipo="columna" data-i="3" class="hueco"></div>
        <div data-tipo="columna" data-i="4" class="hueco"></div>
        <div data-tipo="columna" data-i="5" class="hueco"></div>
        <div data-tipo="columna" data-i="6" class="hueco"></div>
      </div>
    </main>

    <div
      id="victoria"
      class="fixed inset-0 hidden place-items-center bg-black/60 p-4 backdrop-blur-sm"
    >
      <div
        class="rounded-2xl bg-white px-8 py-6 text-center text-slate-800 shadow-2xl motion-safe:animate-aparecer"
      >
        <p class="text-5xl motion-safe:animate-bounce">🎉</p>
        <h2 class="mt-2 text-2xl font-bold">¡Ganaste!</h2>
        <p id="resumen" class="mt-1 text-slate-500"></p>
        <button
          id="otra"
          class="mt-4 rounded-lg bg-mesa px-5 py-2 font-semibold text-white transition hover:scale-105 active:scale-95"
        >
          Jugar otra vez
        </button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
