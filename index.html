<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solitario</title>
  </head>
  <body
    class="min-h-dvh bg-radial from-felt to-felt-dark text-white antialiased"
  >
    <header class="mx-auto max-w-3xl px-3 py-3 sm:px-4 sm:py-4">
      <div class="flex items-center justify-between gap-2">
        <h1 class="text-lg font-bold tracking-tight sm:text-2xl">🃏 Solitario</h1>
        <div class="flex items-center gap-2 text-sm sm:text-base">
          <button
            id="undo"
            title="Deshacer (Ctrl+Z)"
            aria-label="Deshacer"
            class="rounded-lg bg-white/15 px-3 py-1.5 font-semibold ring-1 ring-white/30 transition hover:bg-white/25 active:scale-95 disabled:pointer-events-none disabled:opacity-40 sm:px-4 sm:py-2"
          >
            ↶<span class="hidden sm:inline"> Deshacer</span>
          </button>
          <button
            id="new-game"
            class="rounded-lg bg-white px-3 py-1.5 font-semibold text-felt shadow transition hover:scale-105 active:scale-95 sm:px-4 sm:py-2"
          >
            Nuevo
          </button>
        </div>
      </div>

      <dl class="mt-3 grid grid-cols-4 gap-1.5 text-center sm:gap-3">
        <div class="rounded-lg bg-black/20 py-1.5">
          <dt class="text-[0.65rem] tracking-wide text-white/60 uppercase sm:text-xs">
            Tiempo
          </dt>
          <dd id="time" class="font-bold tabular-nums sm:text-lg">0:00</dd>
        </div>
        <div class="rounded-lg bg-black/20 py-1.5">
          <dt class="text-[0.65rem] tracking-wide text-white/60 uppercase sm:text-xs">
            <span class="sm:hidden">Movs.</span
            ><span class="hidden sm:inline">Movimientos</span>
          </dt>
          <dd id="moves" class="font-bold tabular-nums sm:text-lg">0</dd>
        </div>
        <div class="rounded-lg bg-black/20 py-1.5">
          <dt class="text-[0.65rem] tracking-wide text-white/60 uppercase sm:text-xs">
            Puntos
          </dt>
          <dd id="score" class="font-bold tabular-nums sm:text-lg">0</dd>
        </div>
        <div id="best-box" class="rounded-lg bg-black/20 py-1.5">
          <dt class="text-[0.65rem] tracking-wide text-amber-200/80 uppercase sm:text-xs">
            🏆 Récord
          </dt>
          <dd id="best" class="font-bold text-amber-200 tabular-nums sm:text-lg">—</dd>
        </div>
      </dl>
    </header>

    <main id="table" class="mx-auto max-w-3xl px-3 pb-24 sm:px-4">
      <div
        class="mb-4 grid grid-cols-7 justify-items-center gap-1 sm:mb-6 sm:gap-3"
      >
        <div data-pile="stock" data-pile-index="0" class="slot"></div>
        <div data-pile="waste" data-pile-index="0" class="slot"></div>
        <div></div>
        <div data-pile="foundation" data-pile-index="0" class="slot"></div>
        <div data-pile="foundation" data-pile-index="1" class="slot"></div>
        <div data-pile="foundation" data-pile-index="2" class="slot"></div>
        <div data-pile="foundation" data-pile-index="3" class="slot"></div>
      </div>
      <div class="grid grid-cols-7 justify-items-center gap-1 sm:gap-3">
        <div data-pile="tableau" data-pile-index="0" class="slot"></div>
        <div data-pile="tableau" data-pile-index="1" class="slot"></div>
        <div data-pile="tableau" data-pile-index="2" class="slot"></div>
        <div data-pile="tableau" data-pile-index="3" class="slot"></div>
        <div data-pile="tableau" data-pile-index="4" class="slot"></div>
        <div data-pile="tableau" data-pile-index="5" class="slot"></div>
        <div data-pile="tableau" data-pile-index="6" class="slot"></div>
      </div>
    </main>

    <button
      id="auto-complete"
      class="fixed bottom-5 left-1/2 z-40 hidden -translate-x-1/2 rounded-full bg-amber-300 px-5 py-2.5 font-semibold text-slate-900 shadow-xl transition hover:scale-105 active:scale-95 motion-safe:animate-pop-in"
    >
      ⚡ Autocompletar
    </button>

    <div
      id="win"
      class="fixed inset-0 z-100 hidden place-items-center bg-black/60 p-4 backdrop-blur-sm"
    >
      <div
        class="rounded-2xl bg-white px-8 py-6 text-center text-slate-800 shadow-2xl motion-safe:animate-pop-in"
      >
        <p class="text-5xl motion-safe:animate-bounce">🎉</p>
        <h2 class="mt-2 text-2xl font-bold">¡Ganaste!</h2>
        <p id="summary" class="mt-1 text-slate-500"></p>
        <p id="final-score" class="mt-3 text-3xl font-bold text-felt tabular-nums"></p>
        <p id="bonus" class="text-sm text-slate-500"></p>
        <p id="record-message"></p>
        <button
          id="play-again"
          class="mt-4 rounded-lg bg-felt px-5 py-2 font-semibold text-white transition hover:scale-105 active:scale-95"
        >
          Jugar otra vez
        </button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
